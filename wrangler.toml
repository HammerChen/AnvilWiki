# ⚠️⚠️⚠️ FORKERS READ THIS FIRST ⚠️⚠️⚠️
#
# This wrangler.toml contains the DEMO SITE config (anvil.wiki).
# The [vars] below point at PNGTRID/AnvilWiki's own GitHub Discussions.
#
# When you fork: EITHER
#   (A) Edit the [vars] values below to your own (SITE_URL + GISCUS_*), OR
#   (B) Delete this file (`git rm wrangler.toml && git commit`) and configure
#       env vars in the Cloudflare dashboard instead.
#
# Why this matters: when wrangler.toml exists, it is the SOLE source of truth
# for the Pages project's env — the Cloudflare dashboard's "Environment
# variables" UI is completely IGNORED. If you config env in the dashboard but
# leave this file here with these demo values, your build will use THESE
# values, not yours.
#
# See docs/deployment.md for the full guide.
# ⚠️⚠️⚠️ END FORKER WARNING ⚠️⚠️⚠️

# Cloudflare Pages configuration for local preview with Wrangler.
#
# Usage:
#   pnpm build
#   npx wrangler pages dev dist
#
# This file is optional — Cloudflare Pages auto-detects Astro when you
# connect your GitHub repo via the dashboard. Use this only for local
# preview or `wrangler pages deploy`.
#
# Reference: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "anvilwiki"
compatibility_date = "2026-08-11"
pages_build_output_dir = "dist"

[vars]
# Site (must include https:// protocol — Astro validates this as a URL)
SITE_URL = "https://anvil.wiki"
# Giscus comments (DEMO — anvil.wiki points at PNGTRID/AnvilWiki Discussions)
PUBLIC_GISCUS_REPO = "PNGTRID/AnvilWiki"
PUBLIC_GISCUS_REPO_ID = "R_kgDOT1aRPQ"
PUBLIC_GISCUS_CATEGORY = "Announcements"
PUBLIC_GISCUS_CATEGORY_ID = "DIC_kwDOT1aRPc4DDODo"
PUBLIC_GISCUS_MAPPING = "pathname"
# Sponsor card (empty = disabled, keeps Lighthouse 4×100 out of the box)
PUBLIC_SPONSOR_URL = ""
PUBLIC_SPONSOR_IMAGE_URL = ""
# Cloudflare Web Analytics beacon token (empty = disabled)
PUBLIC_CF_BEACON_TOKEN = ""
#
# ─── Optional slots (empty = disabled) ─────────────────────────────────
# Route (A) users: fill them HERE, not in the dashboard — the dashboard UI
# is ignored while this file exists. Full reference: .env.example / docs/deployment.md
#
# Google AdSense (all 4 set = ads render at 3 positions)
#PUBLIC_ADSENSE_CLIENT = ""
#PUBLIC_ADSENSE_SLOT_STICKY = ""
#PUBLIC_ADSENSE_SLOT_SIDEBAR = ""
#PUBLIC_ADSENSE_SLOT_INCONTENT = ""
# Google Analytics (consent-gated)
#PUBLIC_GA_ID = ""
# Google Search Console verification meta token
#PUBLIC_GSC_VERIFICATION = ""
